<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#201b2b">
  <title>Carrière · Bus Station 3</title>
  <link rel="icon" href="assets/bus-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=20">
  <link rel="stylesheet" href="career.css?v=4">
  <link rel="stylesheet" href="career-profiles.css?v=1">
  <script defer src="assets/vendor/number-flow-0.6.2.js"></script>
  <script defer src="mesh.js?v=4"></script>
  <script defer src="traffic-cone.js?v=1"></script>
  <script defer src="bus-models.js?v=2"></script>
  <script defer src="biomes/catalog.js?v=2"></script>
  <script defer src="biomes/shared-models.js?v=3"></script>
  <script defer src="biomes/countryside.js?v=2"></script>
  <script defer src="biomes/hills.js?v=2"></script>
  <script defer src="biomes/village.js?v=2"></script>
  <script defer src="biomes/city.js?v=2"></script>
  <script defer src="settings.js?v=1"></script>
  <script defer src="game-controls.js?v=2"></script>
  <script defer src="bus-handling.js?v=2"></script>
  <script defer src="bus-audio.js?v=1"></script>
  <script defer src="assets/vendor/three-0.180.0.min.js"></script>
  <script defer src="sky.js?v=1"></script>
  <script defer src="three-lighting.js?v=3"></script>
  <script defer src="notices.js?v=1"></script>
  <script defer src="career-profiles.js?v=1"></script>
  <script defer src="career-physics.js?v=1"></script>
  <script defer src="career-motion.js?v=1"></script>
  <script defer src="career-sim.js?v=6"></script>
  <script defer src="career-render.js?v=5"></script>
  <script defer src="career.js?v=5"></script>
</head>
<body class="career-app">
  <svg class="career-icons" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="ic-back" viewBox="0 0 24 24"><path d="m10 5-7 7 7 7M4 12h17"/></symbol>
    <symbol id="ic-pause" viewBox="0 0 24 24"><path d="M8 5v14m8-14v14" stroke-width="3.5"/></symbol>
    <symbol id="ic-map" viewBox="0 0 24 24"><path d="m2.5 5.5 6-2 7 3 6-2v14l-6 2-7-3-6 2zm6-2v14m7-11v14"/></symbol>
    <symbol id="ic-ticket" viewBox="0 0 24 24"><path d="M3 5h18v5a2 2 0 0 0 0 4v5H3v-5a2 2 0 0 0 0-4zm12 3v1m0 3v1m0 3v1"/></symbol>
    <symbol id="ic-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 4v2"/></symbol>
    <symbol id="ic-speed" viewBox="0 0 24 24"><path d="M4 18a9 9 0 1 1 16 0M12 5v2m6 1-5 6"/><circle cx="12" cy="15" r="1.5"/></symbol>
    <symbol id="ic-horn" viewBox="0 0 24 24"><path d="M4 11h6l9-5v13l-9-4H4zm3 4 1.5 5h3L10 15m12-6v5"/></symbol>
  </svg>
  <header class="career-header">
    <a href="index.html" class="career-home" aria-label="Bus Station 3, accueil"><span class="brand"><span class="wordmark">BUS STATION <b>3</b></span></span></a>
    <span class="career-mode">Carrière</span>
    <a href="index.html" id="back-home" class="career-nav-link"><svg class="icon" aria-hidden="true"><use href="#ic-back"/></svg> Accueil</a>
    <div id="driver-strip" hidden>
      <img id="driver-avatar" alt="" width="32" height="32">
      <span id="driver-name"></span>
      <div id="audio-controls" class="audio-controls"></div>
      <button id="pause-service" class="career-tool" type="button" title="Pause (P)" aria-label="Mettre en pause"><svg class="icon" aria-hidden="true"><use href="#ic-pause"/></svg></button>
    </div>
  </header>
  <main>
    <section id="profiles"></section>
    <noscript>Active JavaScript pour prendre ton service.</noscript>
    <section id="service" aria-label="Service en carrière" hidden>
      <div id="city-stage">
        <canvas id="city-view" tabindex="-1" aria-label="Conduite du bus. Braque avec les flèches ou en glissant sur la route. Immobilise le bus à un arrêt pour la montée et la descente automatiques des passagers. M ouvre le plan."></canvas>
        <div class="stop-display">
          <span id="stop-number"></span>
          <div><span class="instrument-label" id="stop-label"></span><strong id="stop-name"></strong></div>
          <span id="stop-distance"></span>
        </div>
        <button class="network-button" id="open-map" type="button" aria-label="Ouvrir le plan du réseau" title="Plan du réseau (M)">
          <canvas id="mini-map" aria-hidden="true"></canvas>
          <span><svg class="icon" aria-hidden="true"><use href="#ic-map"/></svg> Plan <span class="map-label-end">du réseau</span></span>
        </button>
        <div id="fare-notice" class="notice" aria-hidden="true"></div>
        <div id="fare-status" class="notice-status" role="status" aria-atomic="true"></div>
        <div id="platform-status" role="status" aria-atomic="true"></div>
      </div>
      <div class="instruments">
        <div class="instrument fare"><svg class="icon" aria-hidden="true"><use href="#ic-ticket"/></svg><div><span class="instrument-label">Caisse</span><div class="reading"><strong><number-flow id="balance">0</number-flow></strong><small>€$</small></div></div></div>
        <div class="instrument"><svg class="icon" aria-hidden="true"><use href="#ic-people"/></svg><div><span class="instrument-label">À bord</span><div class="reading"><strong><number-flow id="onboard">0</number-flow></strong></div></div></div>
        <div class="instrument"><svg class="icon" aria-hidden="true"><use href="#ic-speed"/></svg><div><span class="instrument-label">Vitesse</span><div class="reading"><strong><number-flow id="bus-speed">0</number-flow></strong><small>km/h</small></div></div></div>
        <button id="horn" class="career-tool" type="button" aria-label="Klaxonner" title="Klaxonner (H)"><svg class="icon" aria-hidden="true"><use href="#ic-horn"/></svg></button>
        <div class="district-indicator"><i aria-hidden="true"></i><span id="district"></span></div>
      </div>
      <div class="service-help"><span><kbd>↑</kbd> Accélérer</span><span><kbd>↓</kbd> Freiner / reculer</span><span><kbd>←</kbd><kbd>→</kbd> Braquer</span><span><kbd>M</kbd> Plan</span></div>
      <div class="career-touch" role="group" aria-label="Commandes tactiles">
        <div><button type="button" data-drive="left" aria-label="Braquer à gauche">←</button><button type="button" data-drive="right" aria-label="Braquer à droite">→</button></div>
        <div><button type="button" data-drive="brake" aria-label="Freiner ou reculer">Frein</button><button type="button" data-drive="accelerate" aria-label="Accélérer">Gaz</button></div>
      </div>
    </section>
  </main>
  <dialog id="service-menu" aria-labelledby="menu-title">
    <div class="service-dialog-body">
      <h2 id="menu-title">Service en pause</h2>
      <div id="pause-details">
        <p id="service-takings"></p>
        <details id="service-settings"><summary>Réglages graphiques</summary><div class="display-settings" id="graphics-controls"></div></details>
        <a class="audio-credits" href="assets/licenses/cinematic-audio.txt" target="_blank" rel="noopener">Crédits sonores</a>
      </div>
      <div id="map-panel" hidden>
        <canvas id="network-map" aria-label="Plan des routes, des arrêts et de la position du bus"></canvas>
        <ol id="stop-list" aria-label="Arrêts du réseau"></ol>
      </div>
      <div class="service-menu-actions">
        <button class="primary" id="resume-service" type="button">Reprendre le volant</button>
        <button class="secondary" id="menu-map" type="button">Voir le plan</button>
        <button class="secondary" id="change-profile" type="button">Changer de profil</button>
        <button class="secondary" id="exit-career" type="button">Quitter la carrière</button>
      </div>
    </div>
  </dialog>
</body>
</html>
